<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 드롭인 문서 — 소개 영상</title>
<meta name="description" content="문서를 넣는다. 한 문장 말한다. 끝. — 키네틱 타이포 20초 소개.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --w:#F7F6F2; --b:#0C0C0E; --y:#FFD84D; --dim:#8B8E9C;
  --sans:'IBM Plex Sans KR','Pretendard','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:#08080A;color:var(--w);line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
a{color:var(--y)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:4px}

.frame{width:min(1120px,100%)}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.topbar b{color:var(--y)}
.topbar a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--dim)}

/* ── 16:9 스테이지 ── */
.stage{position:relative;aspect-ratio:16/9;background:var(--b);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);cursor:pointer}
.stage.w{background:var(--w)}
.stage.b{background:var(--b)}
.stage.y{background:var(--y)}
.stage.paused .kw,.stage.paused .sub,.stage.paused .cl,.stage.paused .cmdT{animation-play-state:paused !important}

#host{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5%}

/* 키네틱 단어 */
.kw{font-weight:700;font-size:clamp(46px,13vw,158px);line-height:1.15;letter-spacing:-.04em;white-space:nowrap}
.stage.w .kw{color:var(--b)}
.stage.b .kw{color:var(--w)}
.stage.y .kw{color:var(--b);font-size:clamp(60px,17vw,210px)}
.sub{margin-top:2.4%;font-family:var(--mono);font-size:clamp(12px,1.8vw,19px);color:var(--dim)}
.stage.w .sub{color:#5A5D6B}
.stage.y .sub{color:#4A4013}

/* 등장 애니메이션 */
.slam{animation:slam .3s cubic-bezier(.15,1.2,.3,1) both}
@keyframes slam{0%{opacity:0;transform:scale(2.4)}60%{opacity:1;transform:scale(.965)}100%{opacity:1;transform:scale(1)}}
.slide{animation:slide .32s cubic-bezier(.2,.9,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-9%)}to{opacity:1;transform:none}}
.rise{animation:rise .3s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34%)}to{opacity:1;transform:none}}
.flashIn{animation:flashIn .34s cubic-bezier(.15,1.3,.3,1) both}
@keyframes flashIn{0%{opacity:0;transform:scale(.4) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.fadeIn{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 명령어 비트 */
.cmdT{font-family:var(--mono);font-size:clamp(13px,2.3vw,25px);color:var(--w);background:#141519;border:1px solid #2A2C36;border-radius:12px;padding:2.4% 3.2%;max-width:94%}
.cmdT .pr{color:var(--y);font-weight:600}
.cmdT .hl{color:#FFEFAF}
.caret{display:inline-block;width:.55em;height:1.15em;background:var(--y);margin-left:2px;animation:blink .9s steps(1) infinite;vertical-align:text-bottom}
@keyframes blink{50%{opacity:0}}
.cmdOk{margin-top:2.4%;font-family:var(--mono);font-size:clamp(12px,1.8vw,19px);color:#7BC97E}

/* 클러스터 비트 (단어 사방 배치) */
.clWrap{position:relative;width:100%;height:100%}
.cl{position:absolute;font-weight:700;color:var(--w);letter-spacing:-.03em}
.cl .n{font-family:var(--mono);font-size:.32em;color:var(--y);vertical-align:super;margin-right:.2em;letter-spacing:0}
.cl1{top:14%;left:8%;font-size:clamp(34px,7.5vw,92px)}
.cl2{top:16%;right:9%;font-size:clamp(30px,6.5vw,80px);transform:rotate(2deg)}
.cl3{bottom:20%;left:14%;font-size:clamp(30px,6.8vw,84px);transform:rotate(-2deg)}
.cl4{bottom:13%;right:12%;font-size:clamp(38px,8.5vw,104px);color:var(--y)}

/* CTA */
.cta{display:flex;flex-direction:column;align-items:center;gap:3%}
.cta .url{font-family:var(--mono);font-weight:600;font-size:clamp(16px,3.4vw,38px);color:var(--b);background:var(--y);padding:1.4% 2.6%;border-radius:12px;display:inline-flex;align-items:center;gap:16px}
.cta .url button{font-family:var(--mono);font-size:.5em;background:var(--b);border:none;color:var(--y);border-radius:6px;padding:6px 12px;cursor:pointer}
.cta .url button:hover{opacity:.85}
.ctaRow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ctaRow a,.ctaRow button{font-family:var(--mono);font-size:clamp(12px,1.4vw,15px);text-decoration:none;border:1.5px solid #3A3D4A;border-radius:8px;padding:9px 16px;color:var(--w);background:transparent;cursor:pointer;transition:transform .15s,border-color .15s,color .15s}
.ctaRow a:hover,.ctaRow button:hover{transform:translateY(-2px);border-color:var(--y);color:var(--y)}

/* 포스터 */
.overlay{position:absolute;inset:0;z-index:5;background:var(--b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;text-align:center;padding:5%}
.overlay.hide{display:none}
.overlay .t1{font-weight:700;font-size:clamp(34px,7.5vw,92px);letter-spacing:-.04em;line-height:1.2}
.overlay .t1 em{font-style:normal;color:var(--y)}
.overlay .t2{font-family:var(--mono);font-size:clamp(12px,1.5vw,16px);color:var(--dim)}
.bigbtn{font-family:var(--mono);font-size:clamp(14px,1.8vw,18px);background:var(--y);color:var(--b);border:none;border-radius:999px;padding:14px 38px;cursor:pointer;transition:transform .15s;animation:pulse 2s ease-in-out infinite}
.bigbtn:hover{transform:scale(1.07)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,.35)}50%{box-shadow:0 0 0 14px rgba(255,216,77,0)}}

/* 컨트롤 */
.ctrl{display:flex;align-items:center;gap:12px;margin-top:12px}
.ctrl>button{background:none;border:1.5px solid #3A3E52;color:#CFD2DE;border-radius:8px;padding:7px 13px;font-family:var(--mono);font-size:13px;cursor:pointer}
.ctrl>button:hover{border-color:var(--y);color:var(--y)}
.bar{flex:1;height:9px;background:#23252F;border-radius:6px;cursor:pointer;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--y);border-radius:6px}
.hint2{margin-top:8px;font-family:var(--mono);font-size:12px;color:#4E5160;text-align:center}

@media (prefers-reduced-motion:reduce){
  .slam,.slide,.rise,.flashIn,.fadeIn{animation:fadeIn .01s both !important}
  .caret{animation:none}.bigbtn{animation:none}
}
</style>
</head>
<body>

<div class="frame">
  <div class="topbar">
    <span><b>EleninJayTech / claude</b> · 소개 (20초)</span>
    <span><a href="index.html">사용법</a> · <a href="demo.html">설치 시연</a> · <a href="https://github.com/EleninJayTech/claude">GitHub</a></span>
  </div>

  <div class="stage b" id="stage" aria-label="소개 영상">
    <div id="host" aria-live="off"></div>

    <div class="overlay" id="poster">
      <p class="t1">세팅,<br><em>말 한마디</em>로.</p>
      <p class="t2">Claude Code 드롭인 문서 · 20초</p>
      <button class="bigbtn" id="btnStart">▶ 재생</button>
    </div>
  </div>

  <div class="ctrl">
    <button id="btnPlay" aria-pressed="false">⏸</button>
    <div class="bar" id="bar" role="slider" aria-label="진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="fill" id="fill"></div></div>
  </div>
  <p class="hint2">화면 클릭·스페이스바: 재생/일시정지 · 막대 클릭: 이동 · 16:9 그대로 화면 녹화하면 유튜브용 영상</p>
</div>

<script>
"use strict";
const PROMPT='"00_통합-설치.md 를 학습해서 이 프로젝트에 적용해줘"';
/* 비트: t=단어, s=서브, m=배경(w/b/y), a=애니메이션, d=길이(ms) */
const BEATS=[
  {t:"문서를",      m:"w", a:"slam",  d:820},
  {t:"넣는다.",     m:"b", a:"slam",  d:820},
  {t:"한 문장",     m:"w", a:"slide", d:800},
  {t:"말한다.",     m:"b", a:"slam",  d:850},
  {t:"끝.",         m:"y", a:"flashIn", d:1350},
  {type:"cmd",      m:"b", d:3300},
  {type:"cluster",  m:"b", d:2700},
  {t:"기억.",  s:"어제 일을 오늘 이어서 — /resume · /wrap", m:"w", a:"slam", d:1650},
  {t:"잠금.",  s:"비밀번호·열쇠 파일, 읽지도 내보내지도 못하게", m:"b", a:"slam", d:1650},
  {t:"분담.",  s:"어려운 건 비싼 모델 · 단순한 건 싼 모델", m:"w", a:"slam", d:1650},
  {t:"검사.",  s:"\"됐다\" 대신 실행 증거로 보고", m:"b", a:"slam", d:1650},
  {t:"전부,",       m:"w", a:"rise",  d:700},
  {t:"공식 문서로", m:"w", a:"rise",  d:800},
  {t:"그날 확인.",  m:"y", a:"slam",  d:1500},
  {type:"cta",      m:"b", d:0}
];
const TOTAL=BEATS.reduce((a,b)=>a+b.d,0);

const stage=document.getElementById("stage"), host=document.getElementById("host"),
      poster=document.getElementById("poster"), fill=document.getElementById("fill"),
      bar=document.getElementById("bar"), btnPlay=document.getElementById("btnPlay"),
      btnStart=document.getElementById("btnStart");
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=-1, playing=false, timer=null, t0=0, remain=0, typeTimer=null, raf=null, ended=false;

function setBg(m){ stage.classList.remove("w","b","y"); stage.classList.add(m); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }

function render(b){
  host.innerHTML=""; setBg(b.m);
  if(b.type==="cmd"){
    const c=el("p","cmdT fadeIn","<span class='pr'>❯ </span><span class='hl' id='typed'></span><span class='caret'></span>");
    host.appendChild(c);
    const ok=el("p","cmdOk","✓ 감지 → 선택 → 설치 → 검증, Claude가 진행"); ok.style.opacity="0"; host.appendChild(ok);
    clearInterval(typeTimer);
    const tEl=c.querySelector("#typed");
    if(RM){ tEl.textContent=PROMPT; ok.style.opacity="1"; ok.className="cmdOk fadeIn"; return; }
    let i=0; typeTimer=setInterval(()=>{ tEl.textContent=PROMPT.slice(0,++i);
      if(i>=PROMPT.length){ clearInterval(typeTimer); ok.className="cmdOk rise"; ok.style.opacity=""; } },30);
  }
  else if(b.type==="cluster"){
    const w=el("div","clWrap");
    [["감지","1"],["선택","2"],["설치","3"],["검증","4"]].forEach(([t,n],k)=>{
      const c=el("span","cl cl"+n+" flashIn","<span class='n'>0"+n+"</span>"+t);
      c.style.animationDelay=(RM?0:k*0.42)+"s"; w.appendChild(c); });
    host.appendChild(w);
  }
  else if(b.type==="cta"){
    const c=el("div","cta fadeIn",
      "<p class='kw' style='font-size:clamp(30px,6.5vw,78px)'>지금 시작하세요.</p>"+
      "<p class='url'><span>eleninjaytech.github.io/claude</span><button id='btnCopy'>복사</button></p>"+
      "<div class='ctaRow'><a href='index.html'>사용법</a><a href='demo.html'>설치 시연</a>"+
      "<a href='https://github.com/EleninJayTech/claude'>GitHub</a><button id='btnReplay'>↺ 다시 보기</button></div>");
    host.appendChild(c);
    c.querySelector("#btnCopy").addEventListener("click",e=>{ e.stopPropagation();
      navigator.clipboard.writeText("https://eleninjaytech.github.io/claude/")
        .then(()=>{ e.target.textContent="복사됨 ✓"; setTimeout(()=>e.target.textContent="복사",1500); })
        .catch(()=>{ e.target.textContent="Ctrl+C"; }); });
    c.querySelector("#btnReplay").addEventListener("click",e=>{ e.stopPropagation(); seek(0); playOn(); });
  }
  else{
    const w=el("p","kw "+b.a,b.t); host.appendChild(w);
    if(b.s){ const s=el("p","sub rise",b.s); s.style.animationDelay=RM?"0s":".28s"; host.appendChild(s); }
  }
}

function show(i){ clearTimeout(timer); clearInterval(typeTimer);
  poster.classList.add("hide"); ended=false;
  cur=i; const b=BEATS[i]; render(b);
  if(b.type==="cta"){ finish(); return; }
  remain=RM?Math.max(b.d,2400):b.d; t0=performance.now(); schedule(); }

function schedule(){ clearTimeout(timer); if(!playing) return;
  timer=setTimeout(()=>show(cur+1), remain); }

function elapsedBefore(i){ let s=0; for(let k=0;k<i;k++) s+=BEATS[k].d; return s; }
function tickLoop(){ cancelAnimationFrame(raf);
  const loop=()=>{ if(cur>=0 && !ended){
    const b=BEATS[cur];
    const inBeat=b.d - remain + (playing?performance.now()-t0:0);
    const p=Math.min(100,(elapsedBefore(cur)+Math.min(inBeat,b.d))/TOTAL*100);
    fill.style.width=p+"%"; bar.setAttribute("aria-valuenow",Math.round(p)); }
    raf=requestAnimationFrame(loop); };
  raf=requestAnimationFrame(loop); }

function finish(){ playing=false; ended=true;
  btnPlay.textContent="▶"; btnPlay.setAttribute("aria-pressed","false");
  fill.style.width="100%"; bar.setAttribute("aria-valuenow",100); }

function playOn(){ if(playing) return; playing=true;
  btnPlay.textContent="⏸"; btnPlay.setAttribute("aria-pressed","true");
  stage.classList.remove("paused");
  if(cur<0){ show(0); } else { t0=performance.now(); schedule(); } tickLoop(); }
function pauseOn(){ if(!playing) return; playing=false;
  btnPlay.textContent="▶"; btnPlay.setAttribute("aria-pressed","false");
  stage.classList.add("paused"); clearTimeout(timer); remain-=performance.now()-t0; }

function seek(i){ pauseOn(); show(Math.max(0,Math.min(i,BEATS.length-1))); tickLoop(); }

btnStart.addEventListener("click",e=>{ e.stopPropagation(); playOn(); });
btnPlay.addEventListener("click",()=>{ if(ended){ seek(0); playOn(); } else playing?pauseOn():playOn(); });
bar.addEventListener("click",e=>{ const r=bar.getBoundingClientRect();
  const t=(e.clientX-r.left)/r.width*TOTAL; let s=0,i=0;
  for(;i<BEATS.length-1;i++){ s+=BEATS[i].d; if(t<s) break; }
  seek(i); playOn(); });
stage.addEventListener("click",e=>{ if(["BUTTON","A"].includes(e.target.tagName)) return;
  if(cur<0){ playOn(); return; } if(ended){ return; } playing?pauseOn():playOn(); });
document.addEventListener("keydown",e=>{ if(e.code==="Space" && !["BUTTON","A"].includes(e.target.tagName)){
  e.preventDefault(); if(cur<0||ended){ (ended&&seek(0)), playOn(); } else playing?pauseOn():playOn(); } });
</script>
</body>
</html>
